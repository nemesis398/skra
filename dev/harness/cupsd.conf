# Test only: no authentication, every operation allowed for every peer, but
# for a change of cupsd.conf, which asks for a login like Fedora's (below).
# This CUPS lives in a container and is reached through a bind-mounted socket.
LogLevel warn
ErrorLog stderr
AccessLog none
PageLog none
Listen /run/cups/cups.sock
WebInterface No
Browsing Off
DefaultAuthType None
MaxLogSize 0
PreserveJobHistory Yes

# Fedora guards /admin/conf with "AuthType Default" (Basic there) and "Require
# user @SYSTEM". Here only the PUT is guarded, so reading cupsd.conf stays
# open: a PUT needs PeerCred as root, which CUPS takes from root alone, or
# Basic with the password of a SystemGroup member, which CUPS checks through
# PAM. The Containerfile makes the users.
<Location /admin/conf>
  <Limit PUT>
    AuthType Basic
    Require user @SYSTEM
  </Limit>
</Location>

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
