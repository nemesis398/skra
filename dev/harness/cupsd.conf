# Test only: no authentication, every operation allowed for every peer.
# This CUPS lives in a container and is reached through a bind-mounted socket.
LogLevel warn
ErrorLog stderr
AccessLog none
PageLog none
Listen /run/cups/cups.sock
WebInterface No
Browsing Off
DefaultAuthType None
MaxLogSize 0
PreserveJobHistory Yes

<Policy default>
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none
  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
