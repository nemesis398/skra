<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- install.sh replaces the content with the user whose jobs this page shows -->
<meta name="cups-ui-user" content="__CUPS_UI_USER__">
<title>print</title>
<style>
  :root {
    --crust:#11111b; --mantle:#181825; --base:#1e1e2e;
    --s0:#313244; --s1:#45475a; --s2:#585b70;
    --o0:#6c7086; --o1:#7f849c; --sub0:#a6adc8; --sub1:#bac2de; --text:#cdd6f4;
    --accent:#cba6f7; --peach:#fab387; --red:#f38ba8;
  }
  * { box-sizing:border-box; margin:0; padding:0; border-radius:0; }
  html { background:var(--base); }
  body { color:var(--text); font-family:"JetBrainsMono Nerd Font","JetBrains Mono",monospace;
    font-size:13px; font-variant-numeric:tabular-nums; min-height:100vh; }
  i { font-style:normal; }
  button { font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
  :focus-visible { outline:1px solid var(--accent); outline-offset:1px; }
  [hidden] { display:none !important; }

  .app { max-width:1100px; margin:0 auto; padding-bottom:12px; }
  .bar { height:32px; background:var(--mantle); display:flex; align-items:stretch; font-size:14px; }
  .bar .brand { padding:0 14px; display:flex; align-items:center; gap:8px; color:var(--accent); font-weight:700; }
  .bar .tab { padding:0 14px; display:flex; align-items:center; gap:6px; color:var(--sub0); text-decoration:none; }
  .bar .tab.on { background:var(--accent); color:var(--crust); font-weight:700; }
  .bar .tab .ext { color:var(--accent); font-size:12px; }
  .bar .spacer { flex:1; }
  .bar .stat { padding:0 14px; display:flex; align-items:center; gap:8px; white-space:nowrap; }
  .bar .clock { color:var(--accent); font-weight:700; width:170px; justify-content:flex-end; }
  .bar .warn { color:var(--peach); }

  .sec { padding:14px 16px 4px; color:var(--sub0); display:flex; gap:10px; align-items:baseline; }
  .sec b { color:var(--text); }
  .sec .rule { flex:1; border-bottom:1px solid var(--s0); transform:translateY(-4px); }

  .btn { background:var(--s0); color:var(--text); padding:7px 12px; display:inline-flex; gap:8px; align-items:center;
    border-bottom:2px solid transparent; white-space:nowrap; text-decoration:none; }
  .btn i { color:var(--accent); }
  .btn:hover { background:var(--s1); border-bottom-color:var(--accent); }
  .btn.sm { padding:3px 8px; font-size:12px; }
  .btn.lock, .btn.lock i { color:var(--o1); }
  .btn:disabled { color:var(--o0); background:var(--mantle); cursor:default; border-bottom-color:transparent; }
  .btn:disabled i { color:var(--o0); }

  .printers { display:grid; grid-template-columns:repeat(2,1fr); gap:2px; margin:6px 16px 0; }
  .pr { background:var(--mantle); padding:10px 12px; }
  .pr .top { display:flex; justify-content:space-between; align-items:baseline; gap:12px; }
  .pr .pn { font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pr .tag { color:var(--accent); font-size:12px; margin-left:8px; font-weight:400; }
  .pr .st { width:190px; flex:none; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pr .st.need { color:var(--peach); }
  .pr .st.bad { color:var(--red); }
  .pr .facts { color:var(--sub0); font-size:12px; margin-top:3px; }
  .ink { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:12px 0 4px; }
  .ink .c { display:grid; grid-template-columns:22px 1fr 38px; gap:6px; align-items:center; }
  .ink .k { color:var(--sub0); }
  .ink .meter { height:8px; background:var(--s0); }
  .ink .meter span { display:block; height:100%; background:var(--sub0); }
  .ink .v { text-align:right; }
  .ink .c.low .meter span { background:var(--peach); }
  .ink .c.low .v { color:var(--peach); }
  .pr .asof { color:var(--o1); font-size:12px; }
  .pr .acts { display:flex; gap:2px; margin-top:10px; flex-wrap:wrap; }
  .pr.away .pn, .pr.away .st, .pr.away .facts, .pr.away .ink .k, .pr.away .ink .v { color:var(--o0); }
  .pr.away .ink .meter span { background:var(--s2); }

  .drop { margin:6px 16px 0; background:var(--mantle); display:grid; grid-template-columns:1fr auto; gap:12px;
    align-items:center; padding:10px 12px; }
  .drop.over { background:var(--s0); }
  .drop .hint { color:var(--sub0); display:flex; gap:10px; align-items:center; }
  .drop .hint i { color:var(--accent); font-size:18px; }
  .drop .hint b, .drop .hint button { color:var(--text); font-weight:400; }
  .drop .hint button { text-decoration:underline; text-decoration-color:var(--s2); }
  .opts { display:flex; gap:14px; flex-wrap:wrap; justify-content:flex-end; }
  .seg { display:flex; }
  .seg button { padding:3px 8px; color:var(--sub0); border-bottom:2px solid transparent; }
  .seg button.on { color:var(--text); border-bottom-color:var(--accent); }
  .seg button:hover { color:var(--text); }

  table.q { width:calc(100% - 32px); margin:4px 16px 0; border-collapse:collapse; table-layout:fixed; }
  table.q th { text-align:left; font-weight:400; color:var(--o1); font-size:12px; padding:2px 8px; }
  table.q td { padding:4px 8px; height:32px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  table.q tbody tr:hover td { background:var(--s0); }
  table.q .r { text-align:right; }
  .c-id { width:56px; } .c-pr { width:150px; } .c-st { width:220px; } .c-t { width:150px; } .c-pg { width:64px; } .c-a { width:200px; }
  td.jid { color:var(--sub0); }
  td.jn { font-weight:700; }
  td.jp { color:var(--sub0); }
  td.held { color:var(--peach); }
  td.off { color:var(--o0); }
  td.bad { color:var(--red); }
  td.jt { color:var(--o1); text-align:right; }
  td.ja { text-align:right; }
  td.ja .btn { margin-left:2px; }
  .empty { color:var(--o1); padding:8px 24px; }

  .foot { display:flex; justify-content:space-between; gap:16px; padding:10px 16px; margin:12px 0 0;
    background:var(--mantle); color:var(--o1); font-size:12px; }
  .foot .msg { color:var(--sub0); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .foot .msg.bad { color:var(--red); }

  .dialog { position:fixed; left:50%; top:120px; transform:translateX(-50%); width:400px; max-width:calc(100% - 32px);
    background:var(--base); outline:1px solid var(--accent); padding:14px 16px; z-index:2; }
  .dialog h4 { font-size:14px; margin-bottom:8px; overflow-wrap:anywhere; }
  .dialog p { color:var(--sub0); line-height:1.5; margin-bottom:10px; }
  .dialog .row { display:flex; gap:2px; justify-content:flex-end; }

  @media (max-width: 760px) {
    .printers { grid-template-columns:1fr; }
    .drop { grid-template-columns:1fr; }
    .opts { justify-content:flex-start; }
    .c-pr, td.jp, .c-t, td.jt { display:none; }
    .bar .tab.hist, .bar .clock { display:none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="bar">
    <div class="brand"><i>&#xF042A;</i> print</div>
    <a class="tab" id="tab-overview" href="#">Overview</a>
    <a class="tab hist" id="tab-history" href="#history">History</a>
    <a class="tab" href="/admin">CUPS <i class="ext">&#xF03CC;</i></a>
    <div class="spacer"></div>
    <div class="stat warn" id="need" hidden></div>
    <div class="stat clock" id="clock"></div>
  </nav>

  <section id="view-overview">
    <div class="sec"><b>printers</b><span id="pcount"></span><span class="rule"></span></div>
    <div class="printers" id="printers"></div>

    <div class="sec"><b>print a file</b><span class="rule"></span></div>
    <div class="drop" id="drop">
      <div class="hint"><i>&#xF0226;</i><span><b>drop a PDF here</b> or press <b>o</b> to <button type="button" id="choose">choose one</button></span></div>
      <div class="opts" id="opts"></div>
      <input type="file" id="file" accept="application/pdf,image/jpeg,image/png,text/plain" hidden>
    </div>

    <div class="sec"><b>queue</b><span id="qcount"></span><span class="rule"></span></div>
    <table class="q">
      <colgroup><col class="c-id"><col><col class="c-pr"><col class="c-st"><col class="c-t"><col class="c-a"></colgroup>
      <thead><tr><th>job</th><th>name</th><th>printer</th><th>state</th><th class="r">sent</th><th></th></tr></thead>
      <tbody id="queue"></tbody>
    </table>
    <div class="empty" id="qempty" hidden>Nothing is waiting. Drop a file above to print it.</div>

    <div class="sec"><b>last prints</b><span class="rule"></span></div>
    <table class="q">
      <colgroup><col class="c-id"><col><col class="c-pr"><col class="c-st"><col class="c-pg"><col class="c-t"></colgroup>
      <thead><tr><th>job</th><th>name</th><th>printer</th><th>result</th><th class="r">pages</th><th class="r">when</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </section>

  <section id="view-history" hidden>
    <div class="sec"><b>history</b><span id="hcount"></span><span class="rule"></span></div>
    <table class="q">
      <colgroup><col class="c-id"><col><col class="c-pr"><col class="c-st"><col class="c-pg"><col class="c-t"></colgroup>
      <thead><tr><th>job</th><th>name</th><th>printer</th><th>result</th><th class="r">pages</th><th class="r">when</th></tr></thead>
      <tbody id="history"></tbody>
    </table>
  </section>

  <div class="foot">
    <span class="msg" id="msg">connecting to CUPS</span>
    <span id="fresh"></span>
  </div>
</div>

<div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" hidden>
  <h4 id="dlg-title"></h4>
  <p id="dlg-text"></p>
  <div class="row"><button class="btn" id="dlg-no"></button><button class="btn" id="dlg-yes"></button></div>
</div>

<script>
"use strict";
// ── IPP over HTTP, same origin as CUPS ─────────────────────────────────────
// The page is served by CUPS itself, so every request is a same-origin POST of
// application/ipp to localhost:631. CUPS shows job names and lets a user hold,
// release and cancel their own jobs when the request names that user.

const USER = (() => {
  const m = document.querySelector('meta[name="cups-ui-user"]').content;
  return m && !m.startsWith("__") ? m : (new URLSearchParams(location.search).get("user") || "");
})();

const OP = { printJob:0x0002, cancelJob:0x0008, getJobs:0x000A, getPrinterAttributes:0x000B,
  holdJob:0x000C, releaseJob:0x000D, pausePrinter:0x0010, resumePrinter:0x0011,
  getDefault:0x4001, getPrinters:0x4002 };
const TAG = { op:0x01, job:0x02, end:0x03, printer:0x04,
  int:0x21, bool:0x22, enum:0x23, kw:0x44, uri:0x45, charset:0x47, lang:0x48, mime:0x49, name:0x42, text:0x41 };
const enc = new TextEncoder(), dec = new TextDecoder();

function encode(op, groups, data) {
  const out = [];
  const bytes = a => out.push(Uint8Array.from(a));
  const u16 = n => bytes([n >> 8, n & 255]);
  bytes([2, 0, op >> 8, op & 255, 0, 0, 0, 1]);
  const head = [["charset", "attributes-charset", "utf-8"], ["lang", "attributes-natural-language", "en"]];
  if (USER) head.push(["name", "requesting-user-name", USER]);
  groups = { op: [...head, ...(groups.op || [])], job: groups.job || [] };
  for (const g of ["op", "job"]) {
    if (!groups[g].length) continue;
    bytes([TAG[g]]);
    for (const [type, name, value] of groups[g]) {
      for (const [i, v] of [].concat(value).entries()) {
        bytes([TAG[type]]);
        const nb = enc.encode(i ? "" : name); u16(nb.length); out.push(nb);
        const vb = (type === "int" || type === "enum") ? Uint8Array.from([v >>> 24, (v >> 16) & 255, (v >> 8) & 255, v & 255])
                 : type === "bool" ? Uint8Array.from([v ? 1 : 0]) : enc.encode(v);
        u16(vb.length); out.push(vb);
      }
    }
  }
  bytes([TAG.end]);
  if (data) out.push(data);
  return new Blob(out, { type: "application/ipp" });
}

function decode(buf) {
  const d = new DataView(buf), res = { status: d.getUint16(2), op: {}, groups: [] };
  let i = 8, name = null, group = null, depth = 0;
  while (i < buf.byteLength) {
    const t = d.getUint8(i++);
    if (t < 0x10) {
      if (t === TAG.end) break;
      group = t === TAG.op ? res.op : {}; if (t !== TAG.op) res.groups.push(Object.assign(group, { _tag: t }));
      continue;
    }
    const nl = d.getUint16(i); i += 2; const n = dec.decode(new Uint8Array(buf, i, nl)); i += nl;
    const vl = d.getUint16(i); i += 2; const at = i; i += vl;
    if (t === 0x34) { depth++; if (n) name = n; continue; }      // collections are skipped whole
    if (t === 0x37) { depth--; continue; }
    if (depth > 0) continue;
    let v;
    if ((t === TAG.int || t === TAG.enum) && vl === 4) v = d.getInt32(at);
    else if (t === TAG.bool) v = d.getUint8(at) === 1;
    else if (t >= 0x30 && t < 0x40) v = null;                     // dateTime, resolution, range: not used here
    else v = dec.decode(new Uint8Array(buf, at, vl));
    if (n) { name = n; group[name] = v; }
    else if (name) group[name] = [].concat(group[name], v);
  }
  return res;
}

class IppError extends Error {}
async function ipp(path, op, groups = {}, data = null) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/ipp" }, body: encode(op, groups, data) });
  if (r.status === 401) throw new IppError("CUPS wants a login for this");
  if (r.status === 403) throw new IppError("CUPS refused this (403)");
  if (!r.ok) throw new IppError(`CUPS answered HTTP ${r.status}`);
  const res = decode(await r.arrayBuffer());
  if (res.status >= 0x0100) throw new IppError(res.op["status-message"] || `IPP status 0x${res.status.toString(16).padStart(4, "0")}`);
  return res;
}
const list = v => v === undefined ? [] : [].concat(v);
const ask = (...names) => ["kw", "requested-attributes", names];
const printerUri = name => `ipp://localhost/printers/${encodeURIComponent(name)}`;

// ── state ───────────────────────────────────────────────────────────────────
const S = { printers: [], defaultName: "", active: [], done: [], opts: { printer: "", sides: "", color: "", hold: false, copies: 1 },
  lastOk: 0, lastErr: "", message: "", messageBad: false, view: "overview" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

const PRINTER_ATTRS = ["printer-name", "printer-info", "printer-location", "printer-make-and-model", "printer-state",
  "printer-state-reasons", "printer-state-message", "printer-is-accepting-jobs", "device-uri", "queued-job-count",
  "marker-names", "marker-levels", "marker-low-levels", "marker-colors", "marker-types", "marker-change-time",
  "sides-supported", "sides-default", "print-color-mode-supported", "print-color-mode-default"];
const JOB_ATTRS = ["job-id", "job-name", "job-state", "job-state-reasons", "job-printer-uri", "job-printer-state-message",
  "job-media-sheets-completed", "time-at-creation", "time-at-completed", "job-originating-user-name"];

async function load(withHistory) {
  const [pr, def, act] = await Promise.all([
    ipp("/", OP.getPrinters, { op: [ask(...PRINTER_ATTRS)] }),
    ipp("/", OP.getDefault, { op: [ask("printer-name")] }).catch(() => null),
    ipp("/", OP.getJobs, { op: [["uri", "printer-uri", "ipp://localhost/"], ["kw", "which-jobs", "not-completed"], ask(...JOB_ATTRS)] }),
  ]);
  S.printers = pr.groups.filter(g => g._tag === TAG.printer).sort((a, b) => a["printer-name"].localeCompare(b["printer-name"]));
  S.defaultName = def?.groups[0]?.["printer-name"] || "";
  S.active = act.groups.filter(g => g._tag === TAG.job).sort((a, b) => a["job-id"] - b["job-id"]);
  if (withHistory) {
    const done = await ipp("/", OP.getJobs, { op: [["uri", "printer-uri", "ipp://localhost/"], ["kw", "which-jobs", "completed"],
      ["int", "limit", 200], ask(...JOB_ATTRS)] });
    S.done = done.groups.filter(g => g._tag === TAG.job).sort((a, b) => (b["time-at-completed"] || 0) - (a["time-at-completed"] || 0));
  }
  if (!S.opts.printer || !S.printers.some(p => p["printer-name"] === S.opts.printer))
    S.opts.printer = S.defaultName || S.printers[0]?.["printer-name"] || "";
}

// ── words for states ────────────────────────────────────────────────────────
const JOB_STATE = { 3: "waiting", 4: "held", 5: "printing", 6: "stopped", 7: "canceled", 8: "failed", 9: "printed" };
function printerState(p) {
  const reasons = list(p["printer-state-reasons"]).filter(r => r !== "none" && !r.startsWith("cups-"));
  const r = reasons.map(x => x.replace(/-(report|warning|error)$/, ""));
  if (r.includes("offline")) return { text: "away", cls: "away" };
  if (reasons.some(x => x.endsWith("-error"))) return { text: r[0].replaceAll("-", " "), cls: "bad" };
  if (p["printer-state"] === 5) return { text: "paused", cls: "need" };
  if (r.includes("media-empty") || r.includes("media-needed")) return { text: "out of paper", cls: "need" };
  if (r.includes("media-jam")) return { text: "paper jam", cls: "need" };
  if (r.includes("marker-supply-empty")) return { text: "ink empty", cls: "need" };
  if (p["printer-state"] === 4) return { text: "printing", cls: "" };
  return { text: "ready", cls: "" };
}
const printerOf = j => decodeURIComponent((j["job-printer-uri"] || "").split("/printers/")[1] || "");
const shortName = name => { const p = S.printers.find(x => x["printer-name"] === name); return (p?.["printer-info"] || name).split(" ")[0]; };
function when(t) {
  if (!t) return "·";
  const d = new Date(t * 1000), now = new Date();
  const hm = d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return hm;
  return d.toLocaleDateString("en-GB", { weekday: "short", day: "2-digit", month: "short" }).replace(",", "") + " " + hm;
}
function connection(uri = "") {
  const scheme = uri.split(":")[0];
  if (scheme === "usb") return "USB";
  if (/^ipps?:\/\/(localhost|127\.0\.0\.1)/.test(uri) || /\(USB\)/.test(decodeURIComponent(uri))) return "USB through ipp-usb";
  if (["dnssd", "ipp", "ipps", "socket", "lpd", "http", "https"].includes(scheme)) return "network";
  return scheme;
}
function inkLabel(p, i) {
  const n = list(p["marker-names"])[i];
  if (n) { const m = n.match(/black|cyan|magenta|yellow/i); return m ? m[0][0].toUpperCase() : n.slice(0, 2); }
  return `#${i + 1}`;
}

// ── rendering ───────────────────────────────────────────────────────────────
function renderPrinters() {
  $("pcount").textContent = `· ${S.printers.length} ${S.printers.length === 1 ? "queue" : "queues"}`;
  $("printers").innerHTML = S.printers.map(p => {
    const name = p["printer-name"], st = printerState(p), levels = list(p["marker-levels"]);
    const low = list(p["marker-low-levels"]), paused = p["printer-state"] === 5;
    const ink = levels.length ? levels.slice(0, 8).map((lv, i) => {
      const known = lv >= 0, isLow = known && lv <= (low[i] ?? 10);
      return `<div class="c${isLow ? " low" : ""}"><span class="k">${esc(inkLabel(p, i))}</span>` +
        `<span class="meter"><span style="width:${known ? lv : 0}%"></span></span><span class="v">${known ? lv + " %" : "·"}</span></div>`;
    }).join("") : "";
    const asof = p["marker-change-time"] ? `ink as of ${when(p["marker-change-time"])}, the last time CUPS spoke to it` : "no ink levels reported yet";
    const facts = [p["printer-location"], connection(p["device-uri"]),
      /driverless|everywhere/i.test(p["printer-make-and-model"] || "") ? "driverless" : p["printer-make-and-model"]].filter(Boolean).join(" · ");
    return `<div class="pr ${st.cls === "away" ? "away" : ""}">
      <div class="top"><div class="pn">${esc(p["printer-info"] || name)}${name === S.defaultName ? `<span class="tag">&#xF04CE; default</span>` : ""}</div>
        <div class="st ${st.cls}">${st.cls === "away" ? "&#x25CB;" : "&#x25CF;"} ${esc(st.text)}</div></div>
      <div class="facts">${esc(facts)}</div>
      ${ink ? `<div class="ink">${ink}</div>` : ""}
      <div class="asof">${esc(asof)}</div>
      <div class="acts">
        <button class="btn sm" data-act="testpage" data-printer="${esc(name)}"><i>&#xF0219;</i>test page</button>
        <button class="btn sm lock" data-act="${paused ? "resume" : "pause"}" data-printer="${esc(name)}" title="needs the CUPS login">
          <i>&#xF033E;</i>${paused ? "resume queue" : "pause queue"}</button>
        <a class="btn sm" href="/printers/${encodeURIComponent(name)}"><i>&#xF03CC;</i>CUPS page</a>
      </div></div>`;
  }).join("") || `<div class="pr"><div class="facts">CUPS has no printers. Add one in the CUPS tab.</div></div>`;
}

function seg(key, choices) {
  return `<div class="seg" role="group">${choices.map(([v, label]) =>
    `<button type="button" class="${S.opts[key] === v ? "on" : ""}" data-opt="${key}" data-val="${esc(v)}" aria-pressed="${S.opts[key] === v}">${esc(label)}</button>`).join("")}</div>`;
}
function renderOpts() {
  const p = S.printers.find(x => x["printer-name"] === S.opts.printer);
  if (!p) { $("opts").innerHTML = ""; return; }
  const sides = list(p["sides-supported"]), colors = list(p["print-color-mode-supported"]);
  if (!sides.includes(S.opts.sides)) S.opts.sides = p["sides-default"] || sides[0] || "";
  if (!colors.includes(S.opts.color)) S.opts.color = p["print-color-mode-default"] || colors[0] || "";
  const two = sides.includes("two-sided-long-edge") ? "two-sided-long-edge" : sides.find(s => s.startsWith("two-sided"));
  if (S.opts.sides === "two-sided-short-edge" && two === "two-sided-long-edge") S.opts.sides = two;
  $("opts").innerHTML =
    seg("printer", S.printers.map(x => [x["printer-name"], shortName(x["printer-name"])])) +
    (two ? seg("sides", [["one-sided", "1-sided"], [two, "2-sided"]]) : "") +
    (colors.includes("color") ? seg("color", [["color", "color"], ["monochrome", "gray"]]) : "") +
    seg("hold", [[false, "print now"], [true, "hold first"]]);
}

function jobRow(j, active) {
  const st = j["job-state"], name = j["job-name"] || `job ${j["job-id"]}`, pr = shortName(printerOf(j));
  let state = JOB_STATE[st] || "·", cls = "";
  if (st === 4) { state = "&#xF03E4; held · waits for you"; cls = "held"; }
  else if (st === 5) state = `printing · sheet ${(j["job-media-sheets-completed"] || 0) + 1}`;
  else if (st === 7) cls = "off";
  else if (st === 8 || st === 6) { cls = "bad"; const m = j["job-printer-state-message"]; if (m) state += ` · ${esc(m)}`; }
  if (active) {
    const acts = (st === 4 ? `<button class="btn sm" data-act="release" data-job="${j["job-id"]}"><i>&#xF040A;</i>release</button>`
                           : `<button class="btn sm" data-act="hold" data-job="${j["job-id"]}"><i>&#xF03E4;</i>hold</button>`) +
      `<button class="btn sm" data-act="cancel" data-job="${j["job-id"]}"><i>&#xF0156;</i>cancel</button>`;
    return `<tr><td class="jid">${j["job-id"]}</td><td class="jn" title="${esc(name)}">${esc(name)}</td><td class="jp">${esc(pr)}</td>` +
      `<td class="${cls}">${st === 4 ? state : esc(state)}</td><td class="jt">${when(j["time-at-creation"])}</td><td class="ja">${acts}</td></tr>`;
  }
  return `<tr><td class="jid">${j["job-id"]}</td><td class="jn" title="${esc(name)}">${esc(name)}</td><td class="jp">${esc(pr)}</td>` +
    `<td class="${cls}">${state}</td><td class="r">${j["job-media-sheets-completed"] ?? "·"}</td><td class="jt">${when(j["time-at-completed"])}</td></tr>`;
}

function render() {
  const held = S.active.filter(j => j["job-state"] === 4).length;
  const stuck = S.printers.filter(p => printerState(p).cls === "need").length;
  const need = [held && `${held} held`, stuck && `${stuck} ${stuck === 1 ? "printer needs" : "printers need"} you`].filter(Boolean).join(" · ");
  $("need").hidden = !need; $("need").innerHTML = need ? `&#xF002A; ${esc(need)}` : "";
  $("tab-overview").classList.toggle("on", S.view === "overview");
  $("tab-history").classList.toggle("on", S.view === "history");
  $("view-overview").hidden = S.view !== "overview";
  $("view-history").hidden = S.view !== "history";
  renderPrinters(); renderOpts();
  $("qcount").textContent = `· ${S.active.length} ${S.active.length === 1 ? "job" : "jobs"}`;
  $("queue").innerHTML = S.active.map(j => jobRow(j, true)).join("");
  $("qempty").hidden = S.active.length > 0;
  $("queue").closest("table").hidden = S.active.length === 0;
  $("recent").innerHTML = S.done.slice(0, 5).map(j => jobRow(j, false)).join("");
  $("hcount").textContent = `· the last ${S.done.length} jobs CUPS keeps`;
  $("history").innerHTML = S.done.map(j => jobRow(j, false)).join("");
  renderFoot();
}
function renderFoot() {
  const m = $("msg");
  m.textContent = S.message || (S.lastErr ? `CUPS does not answer: ${S.lastErr}` : (USER ? `CUPS at ${location.host} · jobs of ${USER}` : "no user set: job names stay hidden"));
  m.classList.toggle("bad", S.messageBad || (!!S.lastErr && !S.message));
  const age = S.lastOk ? Math.round((Date.now() - S.lastOk) / 1000) : null;
  $("fresh").textContent = age === null ? "" : `updated ${age < 2 ? "just now" : age + " s ago"} · every 2 s while visible`;
}
function say(text, bad = false) { S.message = text; S.messageBad = bad; renderFoot(); clearTimeout(say.t); say.t = setTimeout(() => { S.message = ""; renderFoot(); }, 8000); }

// ── refresh: every 2 s while the page is visible, never in the background ──
let ticks = 0, timer = null, busy = false;
async function tick(force) {
  if (busy) return; busy = true;
  try { await load(force || ticks % 5 === 0); S.lastOk = Date.now(); S.lastErr = ""; render(); }
  catch (e) { S.lastErr = e.message; renderFoot(); }
  finally { busy = false; ticks++; }
}
function start() { if (!timer) { tick(true); timer = setInterval(tick, 2000); } }
function stop() { clearInterval(timer); timer = null; }
document.addEventListener("visibilitychange", () => document.hidden ? stop() : start());
const clock = () => { $("clock").textContent = new Date().toLocaleString("en-GB", { weekday: "short", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }).replace(",", ""); };
clock(); setInterval(clock, 1000);

// ── actions ─────────────────────────────────────────────────────────────────
function confirmBox(title, text, yes, no) {
  return new Promise(resolve => {
    const d = $("dialog"), back = document.activeElement;
    $("dlg-title").textContent = title; $("dlg-text").textContent = text;
    $("dlg-yes").innerHTML = `<i>&#xF0156;</i>${esc(yes)}`; $("dlg-no").textContent = no;
    d.hidden = false; $("dlg-no").focus();
    const done = v => { d.hidden = true; d.onkeydown = $("dlg-yes").onclick = $("dlg-no").onclick = null; back?.focus?.(); resolve(v); };
    $("dlg-yes").onclick = () => done(true); $("dlg-no").onclick = () => done(false);
    d.onkeydown = e => { if (e.key === "Escape") done(false); };
  });
}

async function jobAction(act, id) {
  const j = S.active.find(x => x["job-id"] === id), name = j?.["job-name"] || `job ${id}`;
  if (act === "cancel" && j?.["job-state"] === 5 &&
      !await confirmBox(`Cancel "${name}"?`, `It is printing on the ${shortName(printerOf(j))}. The sheet in the printer may still come out.`, `Cancel job ${id}`, "Keep printing")) return;
  const op = { cancel: OP.cancelJob, hold: OP.holdJob, release: OP.releaseJob }[act];
  const groups = { op: [["uri", "printer-uri", printerUri(printerOf(j))], ["int", "job-id", id]] };
  if (act === "hold") groups.op.push(["kw", "job-hold-until", "indefinite"]);
  await ipp("/jobs/", op, groups);
  say({ cancel: "Canceled", hold: "Held", release: "Released" }[act] + ` "${name}".`);
}

async function printerAction(act, name) {
  if (act === "testpage") {
    // CUPS's own test page is this banner file; the filters fill in the printer's details
    const banner = enc.encode("#PDF-BANNER\nTemplate default-testpage.pdf\nShow printer-name printer-info printer-location " +
      "printer-make-and-model printer-driver-name printer-driver-version paper-size imageable-area job-id options " +
      "time-at-creation time-at-processing\n\n");
    const groups = { op: [["uri", "printer-uri", printerUri(name)], ["name", "job-name", "Test Page"],
      ["mime", "document-format", "application/vnd.cups-pdf-banner"]],
      job: S.opts.hold ? [["kw", "job-hold-until", "indefinite"]] : [] };
    const r = await ipp(`/printers/${encodeURIComponent(name)}`, OP.printJob, groups, banner);
    say(`Test page sent to ${shortName(name)} as job ${r.groups[0]?.["job-id"] ?? "?"}${S.opts.hold ? ", held" : ""}.`);
    return;
  }
  // Pause and resume are admin operations: CUPS answers 401 and the browser asks for the CUPS login.
  await ipp("/admin/", act === "pause" ? OP.pausePrinter : OP.resumePrinter, { op: [["uri", "printer-uri", printerUri(name)]] });
  say(`${act === "pause" ? "Paused" : "Resumed"} the queue of ${shortName(name)}.`);
}

const FORMATS = { pdf: "application/pdf", jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", txt: "text/plain" };
async function printFile(file) {
  const fmt = file.type && Object.values(FORMATS).includes(file.type) ? file.type : FORMATS[file.name.split(".").pop().toLowerCase()];
  if (!fmt) { say(`${file.name}: only PDF, JPEG, PNG and plain text can be printed from here.`, true); return; }
  if (!S.opts.printer) { say("There is no printer to send it to.", true); return; }
  const job = [["int", "copies", S.opts.copies]];
  if (S.opts.sides) job.push(["kw", "sides", S.opts.sides]);
  if (S.opts.color) job.push(["kw", "print-color-mode", S.opts.color]);
  if (S.opts.hold) job.push(["kw", "job-hold-until", "indefinite"]);
  const r = await ipp(`/printers/${encodeURIComponent(S.opts.printer)}`, OP.printJob,
    { op: [["uri", "printer-uri", printerUri(S.opts.printer)], ["name", "job-name", file.name], ["mime", "document-format", fmt]], job },
    new Uint8Array(await file.arrayBuffer()));
  say(`Sent "${file.name}" to ${shortName(S.opts.printer)} as job ${r.groups[0]?.["job-id"] ?? "?"}${S.opts.hold ? ", held until you release it" : ""}.`);
}

async function run(fn) {
  try { await fn(); } catch (e) { say(e.message, true); }
  tick(true);
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-opt]");
  if (!b) return;
  if (b.dataset.opt) {
    const v = b.dataset.val; S.opts[b.dataset.opt] = v === "true" ? true : v === "false" ? false : v; renderOpts(); return;
  }
  if (b.dataset.job) run(() => jobAction(b.dataset.act, Number(b.dataset.job)));
  else run(() => printerAction(b.dataset.act, b.dataset.printer));
});
$("choose").onclick = () => $("file").click();
$("file").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) run(() => printFile(f)); };
document.addEventListener("keydown", e => {
  if (e.key === "o" && !e.ctrlKey && !e.metaKey && !e.altKey && $("dialog").hidden && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) $("file").click();
});
const drop = $("drop");
document.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
document.addEventListener("dragleave", e => { if (!e.relatedTarget) drop.classList.remove("over"); });
document.addEventListener("drop", e => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0]; if (f) run(() => printFile(f));
});
function route() { S.view = location.hash === "#history" ? "history" : "overview"; render(); }
window.addEventListener("hashchange", route);

route();
start();
</script>
</body>
</html>
